experiment_name: fl_causal_gaussian
model_name: parallel_tcn_ssm_last
use_pressure: true
use_diff: true
use_ddiff: true
input_dim: 14
output_dim: 4
num_channels: [64, 64, 64]
kernel_size: 7
dropout: 0.4
parallel: true
fusion: gated
ssm_branch_layers: 1
ssm_dropout: 0.1
ssm_scale_init: 0.1
ssm_expand: 2
ssm_d_state: 8
diff_method: gaussian_causal
gauss_sigma: 3.0
dt: 0.005
label_shift: 0
return_contact_mask: false
pressure_threshold: 1.0e-3
model_uses_contact_mask: false
loss_type: mse
sampler_type: default
window: 180
stride: 30
batch_size: 64
lr: 0.0001
optimizer: Adam
max_epochs: 100
patience: 10
scaler_method: zscore
clip_data: true
